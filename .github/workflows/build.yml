on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to a PR cancels the run it supersedes; runs on main always finish, as the record of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
